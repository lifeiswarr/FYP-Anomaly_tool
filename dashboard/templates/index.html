<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Anomaly Detection SOC</title>
    <!--
    Chosen Palette: "Cyber Dark" (A custom high-contrast palette adapted from Energetic & Playful)
    Application Structure Plan: The SPA is architected as a professional, single-view Security Operations Center (SOC) dashboard. The information architecture is task-oriented, separating controls from visualizations for a clear, intuitive user experience.
    1.  Control & Status Column (Left): This column acts as the command center. It provides dedicated "cards" for primary actions (Live Monitoring), secondary tasks (Model Training), and system feedback (System Log). This separation allows an analyst to perform any action without leaving the main view or losing sight of incoming alerts. The flow is logical: check model status, train if needed, then start monitoring.
    2.  Visualization & Alert Column (Right): This is the primary situational awareness panel. It contains the most critical, real-time outputs: a live-updating chart for traffic composition and, most importantly, the Anomaly Alert Feed. The alert feed is given the most screen real estate, as it is the ultimate output of the entire system.
    This two-column, task-vs-data structure was chosen for its clarity and professional feel. It allows an analyst to control the system and see live feedback simultaneously without changing views, which is optimal for a monitoring tool.
    Visualization & Content Choices:
    - Live Monitoring Control (Buttons): Goal: User Interaction. Method: Styled HTML buttons with icons. Interaction: Click to send 'start_sniffing' or 'stop_sniffing' events to the backend. Justification: Provides explicit, unambiguous control over the live data source.
    - Model Training (Dropdowns & Buttons): Goal: User Interaction. Method: HTML forms with icons. Interaction: Select a data file, click to trigger a 'start_training' event. Justification: Integrates the training workflow directly into the primary UI, removing the need for a separate terminal application.
    - System Log (Dynamic List): Goal: Inform. Method: Structured HTML/CSS. Interaction: New status updates from the backend are prepended in real-time. Justification: Provides essential, non-critical feedback on background tasks without cluttering the main alert feed.
    - Protocol Distribution (Donut Chart): Goal: Compare (Composition). Method: Chart.js Donut Chart. Interaction: Live updates pushed from the backend via WebSockets. Justification: Gives an immediate, easy-to-understand view of the current traffic mix.
    - Anomaly Alert Feed (Dynamic List): Goal: Inform/Organize. Method: Structured HTML/CSS. Interaction: New, explained anomaly alerts are prepended in real-time with visual cues. Justification: This is the core output of the system, presenting the timestamp, classification, and SHAP-based explanation for immediate, actionable intelligence.
    CONFIRMATION: NO SVG graphics used. NO Mermaid JS used.
    -->

<body class="p-4 lg:p-6">

    <div class="container mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="lg:col-span-1 space-y-6">
            <div class="card p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold border-b-2 border-primary pb-2 mb-4 flex items-center"><span class="text-2xl mr-3">⚙️</span>SOC Control Panel</h2>
                <div class="space-y-4">
                    <button id="start-sniffing-btn" class="w-full py-3 font-semibold rounded-md btn-primary flex items-center justify-center space-x-2 disabled:opacity-50" disabled><span class="text-xl">▶️</span><span>Start Live Monitoring</span></button>
                    <button id="stop-sniffing-btn" class="w-full py-3 font-semibold rounded-md btn-danger flex items-center justify-center space-x-2 disabled:opacity-50" disabled><span class="text-xl">⏹️</span><span>Stop Monitoring</span></button>
                </div>
            </div>

            <div class="card p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold border-b-2 border-primary pb-2 mb-4 flex items-center"><span class="text-2xl mr-3">🧠</span>Model Training</h2>
                <div class="space-y-4">
                    <div>
                        <label for="file-select-detector" class="block text-sm font-medium mb-1">Unsupervised Data File:</label>
                        <select id="file-select-detector" class="w-full bg-[#1e1e2f] text-white rounded p-2 border border-primary"></select>
                        <button id="train-detector-btn" class="w-full mt-2 py-2 font-semibold rounded-md btn-secondary disabled:opacity-50" disabled>Train Detector</button>
                    </div>
                    <div>
                        <label for="file-select-classifier" class="block text-sm font-medium mb-1">Supervised Data File:</label>
                        <select id="file-select-classifier" class="w-full bg-[#1e1e2f] text-white rounded p-2 border border-primary"></select>
                        <button id="train-classifier-btn" class="w-full mt-2 py-2 font-semibold rounded-md btn-secondary disabled:opacity-50" disabled>Train Classifier</button>
                    </div>
                </div>
            </div>

            <div class="card p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold border-b-2 border-primary pb-2 mb-4 flex items-center"><span class="text-2xl mr-3">📜</span>System Log</h2>
                <div id="status-log" class="h-64 overflow-y-auto text-sm space-y-2 font-mono pr-2"></div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            <div class="card p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold mb-4 text-center flex items-center justify-center"><span class="text-2xl mr-3">📊</span>Live Protocol Distribution</h2>
                <div class="chart-container"><canvas id="protocolChart"></canvas></div>
            </div>
            <div class="card p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-bold mb-4 flex items-center"><span class="text-2xl mr-3">🚨</span>Anomaly Alert Feed</h2>
                <div id="anomaly-log" class="h-96 overflow-y-auto space-y-3 pr-2">
                    <div class="text-center text-gray-500 pt-16">Awaiting connection to backend...</div>
                </div>
            </div>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const socket = io();
        const statusLog = document.getElementById('status-log');
        const anomalyLog = document.getElementById('anomaly-log');
        const fileSelectDetector = document.getElementById('file-select-detector');
        const fileSelectClassifier = document.getElementById('file-select-classifier');
        const startBtn = document.getElementById('start-sniffing-btn');
        const stopBtn = document.getElementById('stop-sniffing-btn');
        const trainDetectorBtn = document.getElementById('train-detector-btn');
        const trainClassifierBtn = document.getElementById('train-classifier-btn');

        function logStatus(message, level = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${level} opacity-0 translate-y-2 transition-all duration-300`;
            entry.innerHTML = `<span class="text-gray-400">${new Date().toLocaleTimeString()}:</span> ${message}`;
            statusLog.prepend(entry);
            setTimeout(() => { entry.classList.remove('opacity-0', 'translate-y-2'); }, 50);
        }

        const tooltipTitleCallback = (tooltipItems) => {
            const item = tooltipItems[0];
            let label = item.chart.data.labels[item.dataIndex];
            if (Array.isArray(label)) { return label.join(' '); }
            return label;
        };

        const protocolChart = new Chart(document.getElementById('protocolChart').getContext('2d'), {
            type: 'doughnut',
            data: { labels: ['TCP', 'UDP', 'ICMP', 'Other'], datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#7aa2f7', '#9ece6a', '#ff9e64', '#e0af68'], borderColor: '#27293d', borderWidth: 4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#dcd7ba' } }, tooltip: { callbacks: { title: tooltipTitleCallback } } } }
        });

        socket.on('connect', () => {
            logStatus('✅ Connected to SOC backend.', 'success');
            socket.emit('get_files');
            [startBtn, stopBtn, trainDetectorBtn, trainClassifierBtn].forEach(btn => btn.disabled = false);
            anomalyLog.innerHTML = '<div class="text-center text-gray-500 pt-16">System ready. Click "Start Live Monitoring" to begin.</div>';
        });

        socket.on('disconnect', () => {
             logStatus('❌ Disconnected from backend.', 'error');
             [startBtn, stopBtn, trainDetectorBtn, trainClassifierBtn].forEach(btn => btn.disabled = true);
        });

        socket.on('status_update', (data) => logStatus(data.message, data.level));

        socket.on('file_list', (data) => {
            [fileSelectDetector, fileSelectClassifier].forEach(select => {
                select.innerHTML = '';
                data.files.forEach(file => {
                    select.innerHTML += `<option value="${file}">${file}</option>`;
                });
            });
        });

        socket.on('protocol_update', (data) => {
            protocolChart.data.datasets[0].data = [data.tcp, data.udp, data.icmp, data.other];
            protocolChart.update();
        });

        socket.on('anomaly_detected', (data) => {
            if (anomalyLog.children[0]?.classList.contains('text-gray-500')) {
                anomalyLog.innerHTML = '';
            }

            const explanation = data.explanation;
            let explanationHTML = '<ul class="mt-2 pl-4 font-mono text-xs">';
            const sortedFeatures = Object.entries(explanation).sort(([,a],[,b]) => Math.abs(b) - Math.abs(a));

            for(const [feature, value] of sortedFeatures.slice(0, 3)) {
                const directionClass = value > 0 ? 'shap-pos' : 'shap-neg';
                const sign = value > 0 ? '✅' : '❌';
                explanationHTML += `<li class="flex items-center space-x-2 ${directionClass}"><span>${sign}</span><span>${feature}: ${value.toFixed(4)}</span></li>`;
            }
            explanationHTML += '</ul>';

            const entry = document.createElement('div');
            entry.className = 'log-entry anomaly p-4 rounded-md opacity-0 transform -translate-x-4 transition-all duration-500';
            entry.innerHTML = `
                <div class="log-header font-bold text-lg">[${data.timestamp}] ALERT: ${data.classification}</div>
                <div class="log-reason text-sm mt-1">Key Contributing Features:</div>
                ${explanationHTML}
            `;
            anomalyLog.prepend(entry);
            setTimeout(() => { entry.classList.remove('opacity-0', '-translate-x-4'); }, 50);
        });

        startBtn.addEventListener('click', () => socket.emit('start_sniffing'));
        stopBtn.addEventListener('click', () => socket.emit('stop_sniffing'));

        trainDetectorBtn.addEventListener('click', () => {
            const filename = fileSelectDetector.value;
            if (!filename) { logStatus('Please select a file for detector training.', 'error'); return; }
            trainDetectorBtn.disabled = true;
            trainDetectorBtn.textContent = 'Training...';
            socket.emit('start_training', { filename: filename, model_type: 'detector' });
        });

        trainClassifierBtn.addEventListener('click', () => {
            const filename = fileSelectClassifier.value;
            if (!filename) { logStatus('Please select a file for classifier training.', 'error'); return; }
            trainClassifierBtn.disabled = true;
            trainClassifierBtn.textContent = 'Training...';
            socket.emit('start_training', { filename: filename, model_type: 'classifier' });
        });

        socket.on('training_complete', () => {
            trainDetectorBtn.disabled = false;
            trainDetectorBtn.textContent = 'Train Detector';
            trainClassifierBtn.disabled = false;
            trainClassifierBtn.textContent = 'Train Classifier';
        });
    });
</script>
</body>
